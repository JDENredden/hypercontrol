rules:
  ################################################################
  #                       Hyper(Control)                         #
  ################################################################
  - description: Hyper(Control)
    manipulators:
      - description: "Capslock + Command = Control + Command"
        type: basic
        from: { key_code: caps_lock, modifiers: { mandatory: left_command } }
        to: [{ key_code: left_command, modifiers: [left_control] }]

      - description: "Capslock + Option = Control + Option"
        type: basic
        from: { key_code: caps_lock, modifiers: { mandatory: left_option } }
        to: [{ key_code: left_option, modifiers: [left_control] }]

      - description: "Capslock + Shift = Control + Shift"
        type: basic
        from: { key_code: caps_lock, modifiers: { mandatory: left_shift } }
        to: [{ key_code: left_shift, modifiers: [left_control] }]

      - description: "Capslock + Shift + Option = Control + Shift + Option"
        type: basic
        from:
          {
            key_code: caps_lock,
            modifiers: { mandatory: [left_shift, left_option] },
          }
        to: [{ key_code: left_shift, modifiers: [left_control, left_option] }]

      - description: "Capslock + Shift + Command = Control + Shift + Command"
        type: basic
        from:
          {
            key_code: caps_lock,
            modifiers: { mandatory: [left_shift, left_command] },
          }
        to: [{ key_code: left_shift, modifiers: [left_control, left_command] }]

      - description: "Capslock + Option + Command = Control + Option + Command"
        type: basic
        from:
          {
            key_code: caps_lock,
            modifiers: { mandatory: [left_Option, left_command] },
          }
        to: [{ key_code: left_Option, modifiers: [left_control, left_command] }]

