  ################################################################
  #                       Hyper Layer                            #
  ################################################################
  - description: "Hyper Layer"
    manipulators:
      - description: "Hyper + v = Paste and Match Style"
        type: basic
        from:
          {
            key_code: v,
            modifiers:
              {
                mandatory:
                  [right_command, right_control, right_shift, right_option],
              },
          }
        to:
          [{ key_code: v, modifiers: [left_option, left_shift, left_command] }]

      - description: "Hyper + Delete = Forward Delete"
        type: basic
        from:
          {
            key_code: delete_or_backspace,
            modifiers:
              {
                mandatory:
                  [right_command, right_control, right_shift, right_option],
              },
          }
        to: [{ key_code: delete_forward }]

      #==========================================================#
      # ( ; )  -> ( VIM mode )                                 #
      #==========================================================#
      - description: " ; = VIM mode"
        type: basic
        from:
          {
            key_code: semicolon,
            modifiers:
              {
                mandatory:
                  [right_command, right_control, right_shift, right_option],
              },
          }
        to: [{ key_code: caps_lock }]

      #==========================================================#
      # ( [ )  -> ( Prev Space )                                 #
      #==========================================================#
      - description: " [ = Prev space"
        type: basic
        from:
          {
            key_code: open_bracket,
            modifiers:
              {
                mandatory:
                  [right_command, right_control, right_shift, right_option],
              },
          }
        to: [{ key_code: left_arrow, modifiers: [left_control] }]

      #==========================================================#
      # ( ] )  -> ( Next Space )                                 #
      #==========================================================#
      - description: " ] = next space"
        type: basic
        from:
          {
            key_code: close_bracket,
            modifiers:
              {
                mandatory:
                  [right_command, right_control, right_shift, right_option],
              },
          }
        to: [{ key_code: right_arrow, modifiers: [left_control] }]

      #==========================================================#
      # ( , )  -> ( Home )                                       #
      #==========================================================#
      - description: " , = home"
        type: basic
        from:
          {
            key_code: comma,
            modifiers:
              {
                mandatory:
                  [right_command, right_control, right_shift, right_option],
              },
          }
        to: [{ key_code: home }]

      #==========================================================#
      # ( . )  -> ( End )                                        #
      #==========================================================#
      - description: " . = end"
        type: basic
        from:
          {
            key_code: period,
            modifiers:
              {
                mandatory:
                  [right_command, right_control, right_shift, right_option],
              },
          }
        to: [{ key_code: end }]

      #==========================================================#
      # Terminal                                                 #
      #==========================================================#

      #==========================================================#
      # ( d ) -->  Ctrl-D (EOF)                                  #
      #==========================================================#
      - description: "d = ctrl-d (EOF)"
        type: basic
        from:
          {
            key_code: d,
            modifiers:
              {
                mandatory:
                  [right_command, right_control, right_shift, right_option],
              },
          }
        to: [{ key_code: d, modifiers: [left_control] }]

      #==========================================================#
      # ( z ) -->  Ctrl-Z (SIGTSTP)                              #
      #==========================================================#
      - description: "z = ctrl-z"
        type: basic
        from:
          {
            key_code: z,
            modifiers:
              {
                mandatory:
                  [right_command, right_control, right_shift, right_option],
              },
          }
        to: [{ key_code: z, modifiers: [left_control] }]

      #==========================================================#
      # ( c ) -->  Ctrl-C (SIGINT)                               #
      #==========================================================#
      - description: "c = ctrl-c"
        type: basic
        from:
          {
            key_code: c,
            modifiers:
              {
                mandatory:
                  [right_command, right_control, right_shift, right_option],
              },
          }
        to: [{ key_code: c, modifiers: [left_control] }]

      #==========================================================#
      # ( v ) -->  Vim Prefix Meta Key                           #
      #==========================================================#
      # - description: 'v = vim meta key'
      - description: "v = ctrl-v"
        type: basic
        from:
          {
            key_code: v,
            modifiers:
              {
                mandatory:
                  [right_command, right_control, right_shift, right_option],
              },
          }
        to: [{ key_code: v, modifiers: [left_control] }]

      #==========================================================#
      # ( b ) -->  Tmux Prefix Meta Key                          #
      #==========================================================#
      # - description: 'b = tmux meta key'
      - description: "b = ctrl-b"
        type: basic
        from:
          {
            key_code: b,
            modifiers:
              {
                mandatory:
                  [right_command, right_control, right_shift, right_option],
              },
          }
        to: [{ key_code: b, modifiers: [left_control] }]

  ################################################################
  #                    Escape to Greek                           #
  ################################################################
  - description: "Hyper(Control) Greek"
    manipulators:
      - description: "Right Option to Command-Command"
        type: basic
        from: { key_code: right_option }
        to: [{ key_code: right_command, modifiers: [left_command] }]

      #==========================================================#
      # ( a ) --> alpha                                          #
      #==========================================================#

      - description: "alpha"
        type: basic
        from:
          {
            key_code: a,
            modifiers: { mandatory: [right_command, left_command] },
          }
        to:
          [
            { shell_command: 'export LC_ALL=en_US.UTF-8; printf "α" | pbcopy' },
            { key_code: vk_none, hold_down_milliseconds: 100 },
            { key_code: v, modifiers: [left_command] },
          ]

      - description: "alpha caps"
        type: basic
        from:
          {
            key_code: a,
            modifiers: { mandatory: [right_command, left_command, shift] },
          }
        to:
          [
            { shell_command: 'export LC_ALL=en_US.UTF-8; printf "Α" | pbcopy' },
            { key_code: vk_none, hold_down_milliseconds: 100 },
            { key_code: v, modifiers: [left_command] },
          ]

      - description: "alpha LaTeX"
        type: basic
        from:
          {
            key_code: a,
            modifiers: { mandatory: [right_command, left_command, option] },
          }
        to:
          [
            { shell_command: 'printf "\\\alpha" | pbcopy' },
            { key_code: vk_none, hold_down_milliseconds: 100 },
            { key_code: v, modifiers: [left_command] },
          ]

      - description: "alpha LaTeX caps"
        type: basic
        from:
          {
            key_code: a,
            modifiers:
              { mandatory: [right_command, left_command, shift, option] },
          }
        to:
          [
            { shell_command: 'printf "A" | pbcopy' },
            { key_code: vk_none, hold_down_milliseconds: 100 },
            { key_code: v, modifiers: [left_command] },
          ]

      #==========================================================#
      # ( b ) --> beta                                           #
      #==========================================================#

      - description: "beta"
        type: basic
        from:
          {
            key_code: b,
            modifiers: { mandatory: [right_command, left_command] },
          }
        to:
          [
            { shell_command: 'export LC_ALL=en_US.UTF-8; printf "β" | pbcopy' },
            { key_code: vk_none, hold_down_milliseconds: 100 },
            { key_code: v, modifiers: [left_command] },
          ]

      - description: "beta caps"
        type: basic
        from:
          {
            key_code: b,
            modifiers: { mandatory: [right_command, left_command, shift] },
          }
        to:
          [
            { shell_command: 'export LC_ALL=en_US.UTF-8; printf "Β" | pbcopy' },
            { key_code: vk_none, hold_down_milliseconds: 100 },
            { key_code: v, modifiers: [left_command] },
          ]

      - description: "beta LaTeX"
        type: basic
        from:
          {
            key_code: b,
            modifiers: { mandatory: [right_command, left_command, option] },
          }
        to:
          [
            { shell_command: 'printf "\\\beta" | pbcopy' },
            { key_code: vk_none, hold_down_milliseconds: 100 },
            { key_code: v, modifiers: [left_command] },
          ]

      - description: "beta LaTeX caps"
        type: basic
        from:
          {
            key_code: b,
            modifiers:
              { mandatory: [right_command, left_command, shift, option] },
          }
        to:
          [
            { shell_command: 'printf "B" | pbcopy' },
            { key_code: vk_none, hold_down_milliseconds: 100 },
            { key_code: v, modifiers: [left_command] },
          ]

      #==========================================================#
      # ( g ) --> gamma                                          #
      #==========================================================#

      - description: "gamma"
        type: basic
        from:
          {
            key_code: g,
            modifiers: { mandatory: [right_command, left_command] },
