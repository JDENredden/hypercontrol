  ################################################################
  #                       Hyper Control                          #
  ################################################################
  - description: Hyper(Control) Navigation
    manipulators:
      ################################################################
      #           HyperControl Text Navigation                       #
      ################################################################

      #==========================================================#
      # ( h ) + ( ⌘⌥⇧⌃ )  -> ( left )                            #
      #==========================================================#
      # command: selection
      - description: " h = left"
        type: basic
        from:
          {
            key_code: h,
            modifiers:
              {
                mandatory:
                  [right_command, right_control, right_shift, right_option],
                optional: [any],
              },
          }
        to: [{ key_code: left_arrow }]

      #==========================================================#
      # ( j ) + ( ⌘⌥⇧⌃ )  -> ( down )                            #
      #==========================================================#
      # command: selection
      - description: " j = down"
        type: basic
        from:
          {
            key_code: j,
            modifiers:
              {
                mandatory:
                  [right_command, right_control, right_shift, right_option],
                optional: [any],
              },
          }
        to: [{ key_code: down_arrow }]

      #==========================================================#
      # ( k ) + ( ⌘⌥⇧⌃ )  -> ( up )                            #
      #==========================================================#
      # command: selection
      - description: " k = up"
        type: basic
        from:
          {
            key_code: k,
            modifiers:
              {
                mandatory:
                  [right_command, right_control, right_shift, right_option],
                optional: [any],
              },
          }
        to: [{ key_code: up_arrow }]

      #==========================================================#
      # ( l ) + ( ⌘⌥⇧⌃ )  -> ( right )                            #
      #==========================================================#
      - description: " l = right"
        type: basic
        from:
          {
            key_code: l,
            modifiers:
              {
                mandatory:
                  [right_command, right_control, right_shift, right_option],
                optional: [any],
              },
          }
        to: [{ key_code: right_arrow }]

      # - description: " l = right"
      #   type: basic
      #   from:
      #     {
      #       key_code: a,
      #       modifiers:
      #         {
      #           mandatory:
      #             [right_command, right_control, right_shift, right_option],
      #           optional: [any],
      #         },
      #     }
      #   to: [{ key_code: a }]

  #       #==========================================================#
  #       # Command + Arrow Keys                                     #
  #       #==========================================================#
