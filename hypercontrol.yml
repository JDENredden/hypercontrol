---
title: Hyper Control
url:
version: 1.0
maintainers: [jden]
author: jden(iam@jden.me)
website: http://hypercontrol.app
json_url: https://hypercontrol.app/hypercontrol.json
import_url:
gallery_url:
repo:

rules:
  ################################################################
  #                 How this layout is built                     #
  ################################################################
  # Holding Caps Lock sends RIGHT Control. Apps treat it exactly like the
  # normal (left) Control key, so by default Caps + key = Control + key.
  # Neither keyboard has a physical right Control key, so "right_control is
  # down" reliably means "Caps is held", and the rules below key off it:
  #   - Caps Layer: arrows and editing  -> a few keys become arrows etc.
  #   - Caps Layer: Hyper keys          -> listed keys send the Hyper chord
  #                                        (Cmd+Ctrl+Opt+Shift) for app shortcuts
  # The real Control key (MacBook) / Escape key (HHKB) sends LEFT control,
  # which no rule touches, so every native Control shortcut still exists there.
  #
  # Three shared snippets (YAML anchors: "&name" defines, "*name" reuses):
  #   &caps_only  Caps + key, nothing else held
  #   &caps_any   Caps + key, any other modifiers allowed and passed through
  #   &hyper      the four modifiers that make up the Hyper chord

  ################################################################
  #                 Caps Lock = Control / Escape                 #
  ################################################################
  - description: "Caps Lock to Control (tap for Escape)"
    manipulators:
      - description: "capslock = esc(click) | right control(hold)"
        type: basic
        from: { key_code: caps_lock, modifiers: { optional: [any] } }
        to: [{ key_code: right_control }]
        to_if_alone: [{ key_code: escape }]

  ################################################################
  #                    Tab to Meh                                #
  ################################################################
  # Meh = Control+Option+Shift. Built from LEFT-hand modifiers so it never
  # looks like "Caps is held" (right_control) to the Caps-layer rules.
  - description: Tab to Meh
    manipulators:
      - description: "tab = tab(click) | meh(hold)"
        type: basic
        from: { key_code: tab, modifiers: { optional: [any] } }
        to: [{ key_code: left_shift, modifiers: [left_control, left_option] }]
        to_if_alone: [{ key_code: tab }]

  ################################################################
  #                    Escape to Control                         #
  ################################################################
  - description: Escape to Control
    manipulators:
      - description: "Escape = control"
        type: basic
        from: { key_code: escape }
        to: [key_code: left_control]

  ################################################################
  #                       Hyper Shifting                         #
  ################################################################
  - description: Hyper Shifting
    manipulators:
      # Rolling fix: typing ")" then Space quickly means Space lands while
      # right Shift is still down. This rule turns that into ") ".
      # It only applies while rshift_fresh is 1, i.e. within the short window
      # after right Shift was pressed (see "Right shift = )" below), so holding
      # Shift through a space, or Shift+Space to scroll, is left alone.
      # Must stay ABOVE the right-shift rule: Karabiner checks rules top-down,
      # and this mirrors its documented double-press pattern.
      - description: "space + ) = ) + space (only just after pressing right shift)"
        type: basic
        from: { key_code: spacebar, modifiers: { mandatory: [right_shift] } }
        to:
          [{ key_code: "0", modifiers: [right_shift] }, { key_code: spacebar }]
        conditions: [{ type: variable_if, name: rshift_fresh, value: 1 }]

      # Tap window for all four Shift rules is 200 ms (the global default in
      # karabiner.json is 500 ms, which made slow Shift presses type parens).
      # Tune: basic.to_if_alone_timeout_milliseconds below.
      - description: "Left shift = ("
        type: basic
        from: { key_code: left_shift }
        to: [{ key_code: left_shift }]
        to_if_alone: [{ key_code: "9", modifiers: [left_shift] }]
        parameters: { basic.to_if_alone_timeout_milliseconds: 200 }

      # Pressing right Shift also sets rshift_fresh = 1, then clears it after
      # 150 ms (to_if_invoked) or as soon as another key is pressed
      # (to_if_canceled). That is the window the Space rule above relies on.
      # Tune: basic.to_delayed_action_delay_milliseconds below.
      - description: "Right shift = )"
        type: basic
        from: { key_code: right_shift }
        to:
          [
            { set_variable: { name: rshift_fresh, value: 1 } },
            { key_code: right_shift },
          ]
        to_if_alone: [{ key_code: "0", modifiers: [right_shift] }]
        to_delayed_action:
          to_if_invoked: [{ set_variable: { name: rshift_fresh, value: 0 } }]
          to_if_canceled: [{ set_variable: { name: rshift_fresh, value: 0 } }]
        parameters:
          {
            basic.to_if_alone_timeout_milliseconds: 200,
            basic.to_delayed_action_delay_milliseconds: 150,
          }

      # Right Shift held, then left Shift tapped: types ")(".
      - description: "Shift rolls: )("
        type: basic
        from: { key_code: left_shift, modifiers: { mandatory: [right_shift] } }
        to: [{ key_code: left_shift }, { key_code: right_shift }]
        to_if_alone:
          [
            { key_code: "0", modifiers: [right_shift, left_shift] },
            { key_code: "9", modifiers: [right_shift, left_shift] },
          ]
        parameters: { basic.to_if_alone_timeout_milliseconds: 200 }

      # Left Shift held, then right Shift tapped: types "()".
      - description: "Shift rolls: ()"
        type: basic
        from: { key_code: right_shift, modifiers: { mandatory: [left_shift] } }
        to: [{ key_code: right_shift }, { key_code: left_shift }]
        to_if_alone:
          [
            { key_code: "9", modifiers: [right_shift] },
            { key_code: "0", modifiers: [right_shift] },
          ]
        parameters: { basic.to_if_alone_timeout_milliseconds: 200 }

  ################################################################
  #              Caps Layer: arrows and editing                  #
  ################################################################
  - description: "Caps Layer: arrows and editing"
    manipulators:
      # f/b/n/p/h send real arrows / backspace (work everywhere, unlike the
      # Control+f/b/n/p/h text bindings). *caps_any passes every other held
      # modifier through, from either hand:
      #   Caps+Shift+F  = Shift+Right  (select)
      #   Caps+Option+F = Option+Right (word jump)
      #   Caps+Cmd+F    = Cmd+Right    (end of line)
      #   Caps+Cmd+H    = Cmd+Backspace (delete to start of line)
      - description: "caps + f = right arrow"
        type: basic
        from:
          {
            key_code: f,
            modifiers: &caps_any { mandatory: [right_control], optional: [any] },
          }
        to: [{ key_code: right_arrow }]

      - description: "caps + b = left arrow"
        type: basic
        from: { key_code: b, modifiers: *caps_any }
        to: [{ key_code: left_arrow }]

      - description: "caps + n = down arrow"
        type: basic
        from: { key_code: n, modifiers: *caps_any }
        to: [{ key_code: down_arrow }]

      - description: "caps + p = up arrow"
        type: basic
        from: { key_code: p, modifiers: *caps_any }
        to: [{ key_code: up_arrow }]

      - description: "caps + h = backspace"
        type: basic
        from: { key_code: h, modifiers: *caps_any }
        to: [{ key_code: delete_or_backspace }]

      - description: "caps + delete = forward delete"
        type: basic
        from: { key_code: delete_or_backspace, modifiers: *caps_any }
        to: [{ key_code: delete_forward }]

      # , and . are the < and > keys: start / end of document, like Emacs
      # M-< / M-> (also bound to Option+< / > in DefaultKeyBinding.dict).
      # Caps+Shift+, / . selects to the start / end.
      # (Bonus: Caps+. no longer sends Hyper+., which macOS treats as
      # "run sysdiagnose".)
      - description: "caps + , = start of document"
        type: basic
        from: { key_code: comma, modifiers: *caps_any }
        to: [{ key_code: up_arrow, modifiers: [left_command] }]

      - description: "caps + . = end of document"
        type: basic
        from: { key_code: period, modifiers: *caps_any }
        to: [{ key_code: down_arrow, modifiers: [left_command] }]

      # The rest only fire with Caps and nothing else (*caps_only). Add another
      # modifier and they fall through as Control + that modifier + key.
      - description: "caps + v = paste and match style"
        type: basic
        from:
          {
            key_code: v,
            modifiers:
              &caps_only { mandatory: [right_control], optional: [caps_lock] },
          }
        to: [{ key_code: v, modifiers: [left_option, left_shift, left_command] }]

      - description: "caps + [ = previous space"
        type: basic
        from: { key_code: open_bracket, modifiers: *caps_only }
        to: [{ key_code: left_arrow, modifiers: [left_control] }]

      - description: "caps + ] = next space"
        type: basic
        from: { key_code: close_bracket, modifiers: *caps_only }
        to: [{ key_code: right_arrow, modifiers: [left_control] }]

      - description: "caps + space = emoji picker"
        type: basic
        from: { key_code: spacebar, modifiers: *caps_only }
        to: [{ key_code: spacebar, modifiers: [left_control, left_command] }]

  ################################################################
  #                 Caps Layer: Hyper keys                       #
  ################################################################
  # Each key listed here sends Hyper+key (Cmd+Ctrl+Opt+Shift+key), the chord
  # you bind inside apps (launchers, window manager, ...).
  # These are the keys that passed through as Hyper before the restructure
  # (minus , and . which became document start/end), so existing app
  # bindings keep working.
  # A key NOT listed here is plain Control+key when pressed with Caps.
  # To add a shortcut key: copy one line and change both key_codes.
  # The trailing comment is the v3 design label, for reference only.
  - description: "Caps Layer: Hyper keys"
    manipulators:
      - { description: "caps + ` = hyper + `", type: basic, from: { key_code: grave_accent_and_tilde, modifiers: *caps_only }, to: [{ key_code: grave_accent_and_tilde, modifiers: &hyper [right_command, right_control, right_option, right_shift] }] } # window: maximise
      - { description: "caps + 1 = hyper + 1", type: basic, from: { key_code: "1", modifiers: *caps_only }, to: [{ key_code: "1", modifiers: *hyper }] } # window: quarter 1
      - { description: "caps + 2 = hyper + 2", type: basic, from: { key_code: "2", modifiers: *caps_only }, to: [{ key_code: "2", modifiers: *hyper }] } # window: quarter 2
      - { description: "caps + 3 = hyper + 3", type: basic, from: { key_code: "3", modifiers: *caps_only }, to: [{ key_code: "3", modifiers: *hyper }] } # window: quarter 3
      - { description: "caps + 4 = hyper + 4", type: basic, from: { key_code: "4", modifiers: *caps_only }, to: [{ key_code: "4", modifiers: *hyper }] } # window: quarter 4
      - { description: "caps + 5 = hyper + 5", type: basic, from: { key_code: "5", modifiers: *caps_only }, to: [{ key_code: "5", modifiers: *hyper }] } # window: half left
      - { description: "caps + 6 = hyper + 6", type: basic, from: { key_code: "6", modifiers: *caps_only }, to: [{ key_code: "6", modifiers: *hyper }] } # window: half right
      - { description: "caps + 7 = hyper + 7", type: basic, from: { key_code: "7", modifiers: *caps_only }, to: [{ key_code: "7", modifiers: *hyper }] } # window: half top
      - { description: "caps + 8 = hyper + 8", type: basic, from: { key_code: "8", modifiers: *caps_only }, to: [{ key_code: "8", modifiers: *hyper }] } # window: half bottom
      - { description: "caps + 9 = hyper + 9", type: basic, from: { key_code: "9", modifiers: *caps_only }, to: [{ key_code: "9", modifiers: *hyper }] } # window: reasonable size
      - { description: "caps + 0 = hyper + 0", type: basic, from: { key_code: "0", modifiers: *caps_only }, to: [{ key_code: "0", modifiers: *hyper }] } # window: centre
      - { description: "caps + - = hyper + -", type: basic, from: { key_code: hyphen, modifiers: *caps_only }, to: [{ key_code: hyphen, modifiers: *hyper }] } # clipboard popup
      - { description: "caps + = = hyper + =", type: basic, from: { key_code: equal_sign, modifiers: *caps_only }, to: [{ key_code: equal_sign, modifiers: *hyper }] } # Access
      - { description: "caps + \\ = hyper + \\", type: basic, from: { key_code: backslash, modifiers: *caps_only }, to: [{ key_code: backslash, modifiers: *hyper }] } # Passwords
      - { description: "caps + q = hyper + q", type: basic, from: { key_code: q, modifiers: *caps_only }, to: [{ key_code: q, modifiers: *hyper }] } # BusyCal
      - { description: "caps + w = hyper + w", type: basic, from: { key_code: w, modifiers: *caps_only }, to: [{ key_code: w, modifiers: *hyper }] } # Notes  (NB: Hyper+W is also macOS Wi-Fi diagnostics)
      - { description: "caps + r = hyper + r", type: basic, from: { key_code: r, modifiers: *caps_only }, to: [{ key_code: r, modifiers: *hyper }] } # Reminders
      - { description: "caps + y = hyper + y", type: basic, from: { key_code: y, modifiers: *caps_only }, to: [{ key_code: y, modifiers: *hyper }] } # iMessage
      - { description: "caps + u = hyper + u", type: basic, from: { key_code: u, modifiers: *caps_only }, to: [{ key_code: u, modifiers: *hyper }] } # Music
      - { description: "caps + i = hyper + i", type: basic, from: { key_code: i, modifiers: *caps_only }, to: [{ key_code: i, modifiers: *hyper }] } # Nova
      - { description: "caps + s = hyper + s", type: basic, from: { key_code: s, modifiers: *caps_only }, to: [{ key_code: s, modifiers: *hyper }] } # Safari
      - { description: "caps + g = hyper + g", type: basic, from: { key_code: g, modifiers: *caps_only }, to: [{ key_code: g, modifiers: *hyper }] } # Hookmark
      - { description: "caps + j = hyper + j", type: basic, from: { key_code: j, modifiers: *caps_only }, to: [{ key_code: j, modifiers: *hyper }] } # FinBar
      - { description: "caps + ; = hyper + ;", type: basic, from: { key_code: semicolon, modifiers: *caps_only }, to: [{ key_code: semicolon, modifiers: *hyper }] } # expand text
      - { description: "caps + ' = hyper + '", type: basic, from: { key_code: quote, modifiers: *caps_only }, to: [{ key_code: quote, modifiers: *hyper }] } # AI chat
      - { description: "caps + x = hyper + x", type: basic, from: { key_code: x, modifiers: *caps_only }, to: [{ key_code: x, modifiers: *hyper }] } # iTerm2
      - { description: "caps + m = hyper + m", type: basic, from: { key_code: m, modifiers: *caps_only }, to: [{ key_code: m, modifiers: *hyper }] } # Mail
      - { description: "caps + / = hyper + /", type: basic, from: { key_code: slash, modifiers: *caps_only }, to: [{ key_code: slash, modifiers: *hyper }] } # Finder

  ################################################################
  #                    Escape to Greek                           #
  ################################################################
  - description: "Hyper(Control) Greek"
    manipulators:
      - description: "Right Option to Command-Command"
        type: basic
        from: { key_code: right_option }
        to: [{ key_code: right_command, modifiers: [left_command] }]

      #==========================================================#
      # ( a ) --> alpha                                          #
      #==========================================================#

      - description: "alpha"
        type: basic
        from:
          {
            key_code: a,
            modifiers: { mandatory: [right_command, left_command] },
          }
        to:
          [
            { shell_command: 'export LC_ALL=en_US.UTF-8; printf "α" | pbcopy' },
            { key_code: vk_none, hold_down_milliseconds: 100 },
            { key_code: v, modifiers: [left_command] },
          ]

      - description: "alpha caps"
        type: basic
        from:
          {
            key_code: a,
            modifiers: { mandatory: [right_command, left_command, shift] },
          }
        to:
          [
            { shell_command: 'export LC_ALL=en_US.UTF-8; printf "Α" | pbcopy' },
            { key_code: vk_none, hold_down_milliseconds: 100 },
            { key_code: v, modifiers: [left_command] },
          ]

      - description: "alpha LaTeX"
        type: basic
        from:
          {
            key_code: a,
            modifiers: { mandatory: [right_command, left_command, option] },
          }
        to:
          [
            { shell_command: 'printf "\\\alpha" | pbcopy' },
            { key_code: vk_none, hold_down_milliseconds: 100 },
            { key_code: v, modifiers: [left_command] },
          ]

      - description: "alpha LaTeX caps"
        type: basic
        from:
          {
            key_code: a,
            modifiers:
              { mandatory: [right_command, left_command, shift, option] },
          }
        to:
          [
            { shell_command: 'printf "A" | pbcopy' },
            { key_code: vk_none, hold_down_milliseconds: 100 },
            { key_code: v, modifiers: [left_command] },
          ]

      #==========================================================#
      # ( b ) --> beta                                           #
      #==========================================================#

      - description: "beta"
        type: basic
        from:
          {
            key_code: b,
            modifiers: { mandatory: [right_command, left_command] },
          }
        to:
          [
            { shell_command: 'export LC_ALL=en_US.UTF-8; printf "β" | pbcopy' },
            { key_code: vk_none, hold_down_milliseconds: 100 },
            { key_code: v, modifiers: [left_command] },
          ]

      - description: "beta caps"
        type: basic
        from:
          {
            key_code: b,
            modifiers: { mandatory: [right_command, left_command, shift] },
          }
        to:
          [
            { shell_command: 'export LC_ALL=en_US.UTF-8; printf "Β" | pbcopy' },
            { key_code: vk_none, hold_down_milliseconds: 100 },
            { key_code: v, modifiers: [left_command] },
          ]

      - description: "beta LaTeX"
        type: basic
        from:
          {
            key_code: b,
            modifiers: { mandatory: [right_command, left_command, option] },
          }
        to:
          [
            { shell_command: 'printf "\\\beta" | pbcopy' },
            { key_code: vk_none, hold_down_milliseconds: 100 },
            { key_code: v, modifiers: [left_command] },
          ]

      - description: "beta LaTeX caps"
        type: basic
        from:
          {
            key_code: b,
            modifiers:
              { mandatory: [right_command, left_command, shift, option] },
          }
        to:
          [
            { shell_command: 'printf "B" | pbcopy' },
            { key_code: vk_none, hold_down_milliseconds: 100 },
            { key_code: v, modifiers: [left_command] },
          ]

      #==========================================================#
      # ( g ) --> gamma                                          #
      #==========================================================#

      - description: "gamma"
        type: basic
        from:
          {
            key_code: g,
            modifiers: { mandatory: [right_command, left_command] },
          }
        to:
          [
            { shell_command: 'export LC_ALL=en_US.UTF-8; printf "γ" | pbcopy' },
            { key_code: vk_none, hold_down_milliseconds: 100 },
            { key_code: v, modifiers: [left_command] },
          ]

      - description: "gamma caps"
        type: basic
        from:
          {
            key_code: g,
            modifiers: { mandatory: [right_command, left_command, shift] },
          }
        to:
          [
            { shell_command: 'export LC_ALL=en_US.UTF-8; printf "Γ" | pbcopy' },
            { key_code: vk_none, hold_down_milliseconds: 100 },
            { key_code: v, modifiers: [left_command] },
          ]

      - description: "gamma LaTeX"
        type: basic
        from:
          {
            key_code: g,
            modifiers: { mandatory: [right_command, left_command, option] },
          }
        to:
          [
            { shell_command: 'printf "\\\gamma" | pbcopy' },
            { key_code: vk_none, hold_down_milliseconds: 100 },
